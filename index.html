    <style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #ffffff; 
            color: #111111;
            -webkit-font-smoothing: antialiased;
        }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e5e7eb; }

        /* BỐ CỤC MASONRY (Pinterest Style) Ôm khít ảnh, không có khoảng trắng thừa */
        .masonry-grid { 
            column-count: 2; 
            column-gap: 12px; 
        }
        .masonry-item { 
            break-inside: avoid; 
            margin-bottom: 12px; 
            display: inline-block;
            width: 100%;
        }
        @media (min-width: 768px) { 
            .masonry-grid { column-count: 3; column-gap: 20px; } 
            .masonry-item { margin-bottom: 20px; }
        }
        @media (min-width: 1024px) { 
            .masonry-grid { column-count: 4; column-gap: 24px; } 
            .masonry-item { margin-bottom: 24px; }
        }

        @keyframes fadeUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { opacity: 0; animation: fadeUp 0.5s ease-out forwards; }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }

        .tag-btn {
            padding: 8px 16px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
            white-space: nowrap;
            border: 1px solid #e5e7eb;
            color: #6b7280;
            background: #fff;
        }
        .tag-btn.active {
            background: #000;
            color: #fff;
            border-color: #000;
        }
        
        .btn-outline {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            border: 1px solid #000;
            color: #000;
            background: transparent;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
        }
        .btn-outline:hover { background: #000; color: #fff; }
        
        .admin-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .admin-input:focus { border-color: #000; }
        
        .admin-cat-btn {
            flex: 1; min-width: 30%; text-align: center; padding: 10px; border: 1px solid #e5e7eb;
            font-size: 10px; font-weight: bold; text-transform: uppercase; transition: all 0.2s;
            cursor: pointer; color: #6b7280;
        }
        .admin-cat-btn.active { background: #000; color: #fff; border-color: #000; }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, serverTimestamp, query, orderBy, setDoc, getDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBKJPrso3IN2CGwjdE67Ax6SAFhsALre84",
            authDomain: "tramauthentic.firebaseapp.com",
            projectId: "tramauthentic",
            storageBucket: "tramauthentic.firebasestorage.app",
            messagingSenderId: "960445069961",
            appId: "1:960445069961:web:026f0556b5975367b66458"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const IK_PRIVATE_KEY = "private_VmxMhMF+rrRzNAireiHKHhaRa0Y="; 
        const IK_UPLOAD_ENDPOINT = "https://upload.imagekit.io/api/v1/files/upload";
        const IK_AUTH = btoa(IK_PRIVATE_KEY + ":");

        const CATEGORIES = ['Tất cả', 'Crocs', 'Charm Crocs', 'Áo Đấu', 'Dép Daily', 'Giày', 'Phụ kiện khác', 'Crocs 2hand'];
        
        let shoesData = [];
        let currentFilter = 'Tất cả';
        let currentAdminFilter = 'Tất cả';
        let activeUploadCategory = 'Crocs';

        const tagsContainer = document.getElementById('tags-container');
        const catalogGrid = document.getElementById('catalog-grid');
        const loader = document.getElementById('loader');
        
        const modal = document.getElementById('product-modal');
        const modalImg = document.getElementById('modal-img');
        const modalSize = document.getElementById('modal-size-text');
        const modalNote = document.getElementById('modal-note-text');
        
        const adminSec = document.getElementById('admin-section');
        const uploadCategoryBtns = document.getElementById('upload-category-btns');
        const adminTagsContainer = document.getElementById('admin-tags-container');
        const adminProductList = document.getElementById('admin-product-list');
        const editSelectCat = document.getElementById('edit-category');
        
        async function updatePageViews() {
            if(sessionStorage.getItem('visited')) return;
            sessionStorage.setItem('visited', 'true');
            
            const now = new Date();
            const vnTime = new Date(now.getTime() + (7 * 60 * 60 * 1000));
            const yyyy = vnTime.getUTCFullYear();
            const mm = String(vnTime.getUTCMonth() + 1).padStart(2, '0');
            const dd = String(vnTime.getUTCDate()).padStart(2, '0');
            
            const dayKey = `${yyyy}-${mm}-${dd}`;
            const monthKey = `${yyyy}-${mm}`;
            
            const statRef = doc(db, 'analytics', 'views');
            await setDoc(statRef, {
                [dayKey]: increment(1),
                [monthKey]: increment(1)
            }, { merge: true });
        }

        async function loadStatsForAdmin() {
            const now = new Date();
            const vnTime = new Date(now.getTime() + (7 * 60 * 60 * 1000));
            const yyyy = vnTime.getUTCFullYear();
            const mm = String(vnTime.getUTCMonth() + 1).padStart(2, '0');
            const dd = String(vnTime.getUTCDate()).padStart(2, '0');
            
            const dayKey = `${yyyy}-${mm}-${dd}`;
            const monthKey = `${yyyy}-${mm}`;
            
            try {
                const docSnap = await getDoc(doc(db, 'analytics', 'views'));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('stat-today').innerText = data[dayKey] || 0;
                    document.getElementById('stat-month').innerText = data[monthKey] || 0;
                }
            } catch (e) { console.log("Lỗi tải thống kê", e); }
        }

        CATEGORIES.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = `tag-btn ${cat === 'Tất cả' ? 'active' : ''}`;
            btn.innerText = cat;
            btn.onclick = () => {
                document.querySelectorAll('#tags-container .tag-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = cat;
                renderCatalog();
            };
            tagsContainer.appendChild(btn);
            
            if(cat !== 'Tất cả') {
                const upBtn = document.createElement('div');
                upBtn.className = `admin-cat-btn ${cat === activeUploadCategory ? 'active' : ''}`;
                upBtn.innerText = cat;
                upBtn.onclick = () => {
                    document.querySelectorAll('#upload-category-btns .admin-cat-btn').forEach(b => b.classList.remove('active'));
                    upBtn.classList.add('active');
                    activeUploadCategory = cat;
                };
                uploadCategoryBtns.appendChild(upBtn);

                const opt = document.createElement('option');
                opt.value = cat; opt.innerText = cat;
                editSelectCat.appendChild(opt);
            }

            const adBtn = document.createElement('button');
            adBtn.className = `px-3 py-1 border text-[10px] font-bold uppercase transition ${cat === 'Tất cả' ? 'bg-black text-white border-black' : 'bg-transparent text-gray-500 border-gray-200'}`;
            adBtn.innerText = cat;
            adBtn.onclick = () => {
                document.querySelectorAll('#admin-tags-container button').forEach(b => { b.className = 'px-3 py-1 border text-[10px] font-bold uppercase transition bg-transparent text-gray-500 border-gray-200'; });
                adBtn.className = 'px-3 py-1 border text-[10px] font-bold uppercase transition bg-black text-white border-black';
                currentAdminFilter = cat;
                renderAdminList();
            };
            adminTagsContainer.appendChild(adBtn);
        });

        async function fetchProducts() {
            try {
                shoesData = [];
                const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                querySnapshot.forEach((doc) => {
                    shoesData.push({ id: doc.id, ...doc.data() });
                });
            } catch (error) { console.error("Lỗi tải:", error); }
        }

        function renderCatalog() {
            loader.classList.add('hidden');
            catalogGrid.classList.remove('hidden');
            catalogGrid.innerHTML = '';

            let filtered = currentFilter === 'Tất cả' ? shoesData : shoesData.filter(s => s.category === currentFilter);
            
            if(currentFilter === 'Tất cả' && filtered.length > 40) {
                filtered = filtered.slice(0, 40);
            }

            if(filtered.length === 0) {
                catalogGrid.innerHTML = '<div class="w-full inline-block text-center text-xs text-gray-400 uppercase tracking-widest font-bold mt-10">Chưa có sản phẩm</div>';
                return;
            }

            filtered.forEach(item => {
                const itemWrapper = document.createElement('div');
                itemWrapper.className = 'masonry-item animate-fade-up';
                
                const card = document.createElement('div');
                card.className = 'group cursor-pointer bg-gray-50 border border-gray-100 p-2.5 transition-all hover:border-black hover:shadow-lg rounded-md flex flex-col';
                
                const optUrl = item.imageUrl.includes("tr=") ? item.imageUrl : item.imageUrl + "?tr=w-500,f-webp,q-80";
                
                // Loại bỏ truncate, dùng leading-snug để chữ dài tự rớt dòng thoải mái
                const noteHtml = item.noteText ? `<p class="text-[11px] font-extrabold text-black uppercase tracking-widest text-center px-1 mb-1 leading-snug">${item.noteText}</p>` : '';
                
                card.innerHTML = `
                    <div class="relative w-full rounded overflow-hidden mb-3 bg-[#e5e7eb] flex items-center justify-center">
                        <img src="${optUrl}" class="w-full h-auto block relative z-10" loading="lazy">
                    </div>
                    ${noteHtml}
                    <p class="text-[11px] font-extrabold text-black uppercase tracking-widest text-center px-1 leading-snug">Size: ${item.sizeText}</p>
                `;

                card.onclick = () => {
                    modalImg.src = item.imageUrl + "?tr=w-800,f-webp,q-90";
                    modalSize.innerText = "Size: " + item.sizeText;
                    
                    if (item.noteText) {
                        modalNote.innerText = item.noteText;
                        modalNote.classList.remove('hidden');
                    } else {
                        modalNote.innerText = "";
                        modalNote.classList.add('hidden');
                    }
                    
                    modal.classList.remove('hidden');
                };
                
                itemWrapper.appendChild(card);
                catalogGrid.appendChild(itemWrapper);
            });
        }
        
        document.getElementById('close-modal').onclick = () => modal.classList.add('hidden');

        document.getElementById('admin-trigger-btn').onclick = () => {
            document.getElementById('password-modal').classList.remove('hidden');
            document.getElementById('pass-input').value = '';
            document.getElementById('pass-error').classList.add('hidden');
        };
        document.getElementById('cancel-pass-btn').onclick = () => document.getElementById('password-modal').classList.add('hidden');
        
        document.getElementById('submit-pass-btn').onclick = checkPass;
        document.getElementById('pass-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') checkPass(); });
        
        function checkPass() {
            if (document.getElementById('pass-input').value === '0814') {
                document.getElementById('password-modal').classList.add('hidden');
                adminSec.classList.remove('hidden');
                loadStatsForAdmin();
                renderAdminList();
            } else { document.getElementById('pass-error').classList.remove('hidden'); }
        }
        document.getElementById('close-admin').onclick = () => adminSec.classList.add('hidden');

        const uploadBtn = document.getElementById('upload-btn');
        uploadBtn.onclick = async () => {
            const file = document.getElementById('image-input').files[0];
            const size = document.getElementById('upload-size').value.trim();
            const note = document.getElementById('upload-note').value.trim();
            const sts = document.getElementById('upload-status');
            
            if(!file || !size) { sts.innerHTML = "<span class='text-red-500'>Vui lòng chọn ảnh & nhập size!</span>"; return; }
            
            uploadBtn.disabled = true; uploadBtn.innerText = "Đang Tải Ảnh...";
            sts.innerHTML = "<span class='text-blue-500'>Đang đẩy lên ImageKit...</span>";

            try {
                const formData = new FormData();
                formData.append("file", file);
                formData.append("fileName", "tram-sp-" + Date.now());
                formData.append("folder", "/tramauthentic"); 

                const resIK = await fetch(IK_UPLOAD_ENDPOINT, { method: "POST", headers: { "Authorization": "Basic " + IK_AUTH }, body: formData });
                if (!resIK.ok) throw new Error("ImageKit lỗi");
                const ikData = await resIK.json();

                sts.innerHTML = "<span class='text-blue-500'>Đang lưu Dữ liệu...</span>";
                await addDoc(collection(db, "products"), {
                    imageUrl: ikData.url,
                    imageKitFileId: ikData.fileId,
                    category: activeUploadCategory,
                    sizeText: size,
                    noteText: note,
                    createdAt: serverTimestamp() 
                });

                sts.innerHTML = "<span class='text-green-500'>Thành Công!</span>";
                document.getElementById('image-input').value = '';
                document.getElementById('upload-size').value = '';
                document.getElementById('upload-note').value = '';
                
                await fetchProducts(); renderCatalog(); renderAdminList();
            } catch(e) { sts.innerHTML = `<span class='text-red-500'>Lỗi: ${e.message}</span>`; }
            
            setTimeout(() => { uploadBtn.disabled = false; uploadBtn.innerText = "Tải lên Hệ thống"; sts.innerHTML = ""; }, 2000);
        };

        let currentEditId = null;
        const editModal = document.getElementById('admin-edit-modal');
        
        function renderAdminList() {
            adminProductList.innerHTML = '';
            let filtered = currentAdminFilter === 'Tất cả' ? shoesData : shoesData.filter(s => s.category === currentAdminFilter);

            filtered.forEach(item => {
                const div = document.createElement('div');
                // Admin dùng ảnh vuông cắt giữa (object-cover) cho gọn
                div.className = 'relative aspect-square border border-gray-200 group bg-gray-50 rounded overflow-hidden';
                div.innerHTML = `
                    <img src="${item.imageUrl}?tr=w-200,h-200,fo-auto" class="w-full h-full object-cover p-1">
                    <div class="absolute inset-0 bg-black/60 flex flex-col items-center justify-center gap-3 opacity-0 group-hover:opacity-100 transition backdrop-blur-sm">
                        <button class="edit-btn bg-white text-black text-[10px] font-bold px-5 py-2 uppercase tracking-widest w-24 hover:bg-gray-200 rounded-sm">Sửa</button>
                        <button class="del-btn bg-red-600 text-white text-[10px] font-bold px-5 py-2 uppercase tracking-widest w-24 hover:bg-red-700 rounded-sm">Xóa</button>
                    </div>
                `;
                
                div.querySelector('.edit-btn').onclick = () => {
                    currentEditId = item.id;
                    document.getElementById('edit-category').value = item.category || 'Giày';
                    document.getElementById('edit-size').value = item.sizeText || '';
                    document.getElementById('edit-note').value = item.noteText || '';
                    document.getElementById('edit-status').innerHTML = '';
                    editModal.classList.remove('hidden');
                };

                div.querySelector('.del-btn').onclick = async () => {
                    const ans = confirm("Hành động này sẽ XÓA SẢN PHẨM KHỎI WEB. Tiếp tục?");
                    if(!ans) return;
                    
                    const delSts = document.getElementById('admin-delete-status');
                    delSts.innerText = "Đang xóa dữ liệu...";
                    
                    try {
                        await deleteDoc(doc(db, "products", item.id));
                        delSts.innerText = "Đã gỡ sản phẩm!";
                        await fetchProducts(); renderCatalog(); renderAdminList();
                        setTimeout(() => { delSts.innerText = ""; }, 2500);
                    } catch(e) { delSts.innerText = "Lỗi Xóa: " + e.message; }
                };
                adminProductList.appendChild(div);
            });
        }

        document.getElementById('cancel-edit-btn').onclick = () => editModal.classList.add('hidden');
        document.getElementById('save-edit-btn').onclick = async () => {
            const newCat = document.getElementById('edit-category').value;
            const newSize = document.getElementById('edit-size').value.trim();
            const newNote = document.getElementById('edit-note').value.trim();
            const sts = document.getElementById('edit-status');
            
            if(!newSize) { sts.innerHTML = "<span class='text-red-500'>Vui lòng nhập Size!</span>"; return; }
            sts.innerHTML = "<span class='text-blue-500'>Đang lưu...</span>";
            
            try {
                await updateDoc(doc(db, "products", currentEditId), {
                    category: newCat,
                    sizeText: newSize,
                    noteText: newNote
                });
                sts.innerHTML = "<span class='text-green-500'>Đã cập nhật!</span>";
                await fetchProducts(); 
                renderCatalog(); 
                renderAdminList();
                setTimeout(() => { editModal.classList.add('hidden'); }, 1000);
            } catch(e) { sts.innerHTML = `<span class='text-red-500'>Lỗi: ${e.message}</span>`; }
        };

        async function init() {
            updatePageViews();
            await fetchProducts();
            renderCatalog();
        }
        init();
    </script>
</body>
</html>
